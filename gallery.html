<style>

      h1,h2,h3,h4,h5,h6 {
    text-align:center;
    font-size: 2rem;
    color: black;
}

* {
    margin:0;
    padding:0;
    text-align: center;
    margin-bottom: 1rem;
    box-sizing: border-box;
    font-family: 'Arial', sans-serif;
}

p {
    text-align: center;
}

body {
    background-image: url("https://ethnasia.com/cdn/shop/articles/sean-o-KMn4VEeEPR8-unsplash_edited.jpg?v=1621585619");
    background-size: cover;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    max-width: 800px;
    margin: 20px auto;
}

.gallery img {
    width: 100%;
    border-radius: 8px;
    transition: transform 0.3s;
}

.gallery img:hover {
    transform: scale(1.05);
}

.slideshow-container {
    max-width: 600px;
    margin: 20px auto;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    position: relative;
}

.slide {
    width: 100%;
    height: 300px;
    object-fit: cover;
    display: none;
    transition: opacity 1s;
}


@keyframes flyRight {
  0% { left: -10%; }
  100% { left: 110%; }
}

@keyframes flyLeft {
  0% { left: 110%; }
  100% { left: -10%; }
}

@keyframes flyDiagonal {
  0% { left: -10%; top: 80%; transform: rotate(0deg); }
  100% { left: 110%; top: 0%; transform: rotate(20deg); }
}

@keyframes flyDiagonalReverse {
  0% { left: 110%; top: 0%; transform: rotate(0deg); }
  100% { left: -10%; top: 80%; transform: rotate(-20deg); }
}

footer {
    width: 100%;
    padding: 10px;
    text-align: center;
}
body *:hover {
    color: purple;          
    text-shadow: 0 0 8px white; 
    transition: 0.3s;       
}
.blog-post:hover {
  transform: scale(1.03);
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  transition: all 0.3s ease;
}
.fancy-logo {
            font-family: 'Lobster', cursive; 
            font-size: 64px;                 
            color: black;              
            text-shadow: 2px 2px 6px rgba(0,0,0,0.2); 
            letter-spacing: 1px;              
            margin: 40px 0;                 
            text-align: center;           
        }
}
